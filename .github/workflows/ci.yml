name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Version comes from the "packageManager" field in package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Cheap checks first so an obvious break fails in seconds.
      - run: pnpm lint
      - run: pnpm typecheck

      # Build before test: the markup assertions read .next/server/app/index.html,
      # and would silently skip if the build had not run yet.
      - run: pnpm build
      - run: pnpm test
